{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<div id="error-message" style="color: red; display: none; margin-bottom: 15px;"></div>

<form id="loginForm" method="post">
    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit" id="loginBtn">Login</button>

    <hr>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('auth.google_login') }}" class="oauth-btn google-btn">
            Sign in with Google
        </a>
        <a href="{{ url_for('auth.steam_login') }}" class="oauth-btn steam-btn">
            Sign in with Steam
        </a>
    </div>

</form>

<p>Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a></p>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('error-message');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'Logging in...';
    errorMsg.style.display = 'none';
    
    fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Redirect to home on success
            window.location.href = data.redirect_url;
        } else {
            errorMsg.innerText = data.message;
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Login';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        errorMsg.innerText = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Login';
    });
});
</script>
{% endblock %}
