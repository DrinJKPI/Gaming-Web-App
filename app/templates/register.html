{% extends "base.html" %}

{% block content %}

<h2>Register</h2>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

{% if success %}
    <p style="color: green;">{{ success }}</p>
{% endif %}

<div id="status-message" style="margin-bottom: 15px; display: none;"></div>

<form id="registerForm" method="post">
    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Full Name (optional):</label><br>
    <input type="text" name="full_name"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required minlength="8"><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" name="confirm_password" required><br><br>

    <button type="submit" id="regBtn">Register</button>
</form>

<p>Already have an account? <a href="{{ url_for('main.login') }}">Login here</a></p>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = document.getElementById('regBtn');
    const statusMsg = document.getElementById('status-message');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'Registering...';
    statusMsg.style.display = 'none';
    
    fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            statusMsg.innerText = data.message;
            statusMsg.style.color = 'green';
            statusMsg.style.display = 'block';
            setTimeout(() => {
                window.location.href = data.redirect_url;
            }, 2000);
        } else {
            statusMsg.innerText = data.message;
            statusMsg.style.color = 'red';
            statusMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Register';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        statusMsg.innerText = 'An error occurred. Please try again.';
        statusMsg.style.color = 'red';
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register';
    });
});
</script>
{% endblock %}
