# Builds and pushes the image on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — Docker Hub namespace (e.g. drinjkpi)
#   DOCKERHUB_TOKEN      — Docker Hub access token (https://docs.docker.com/docker-hub/access-tokens/)

name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/game-vault:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/game-vault:${{ github.sha }}
